<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="form-container">
    <div class="card">
        <h1>Edit Student</h1>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="post">
            <label>Full Name *</label>
            <input name="name" value="{{ student.name }}" required>

            <label>Roll Number *</label>
            <input name="roll_no" value="{{ student.roll_no }}" required>

            <label>Course *</label>
            <input name="course" value="{{ student.course }}" required>

            <label>Email</label>
            <input type="email" name="email" value="{{ student.email or '' }}">

            <label>Phone</label>
            <input name="phone" value="{{ student.phone or '' }}">

            <div class="form-actions">
                <button class="btn" type="submit">Update Student</button>
                <a class="secondary" href="{{ url_for('index') }}">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
